name: Deploy dist
on:
    push:
        branches:
            - main
            - 'feature/**'
        paths-ignore:
            - README.md
            - '.github/workflows/*'
    workflow_dispatch:
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Get Code
              uses: actions/checkout@v4
              # run: |
              #   echo "Cloning repo"
              #   echo "${{toJson(github)}}"
              #   git clone https://github.com/${{github.repository}}.git myfiles
              #   cd myfiles && ls
            - name: Setup node and install dependencies
              uses: ./.github/actions/setupnode
              with:
                  node-version: 24
            - name: Run Tests
              run: npm run test
            - name: Completed Job
              run: echo "Completed Job"
    build:
        needs: [test]
        runs-on: ubuntu-latest
        steps:
            - name: Clone repo
              uses: actions/checkout@v4
            - name: Setup node and install dependencies
              uses: ./.github/actions/setupnode
            - name: Build dist
              run: npm run build
            - name: Upload dist artifact
              uses: actions/upload-artifact@v4
              with:
                  name: dist-files
                  path: dist
    deploy:
        needs: [build]
        runs-on: ubuntu-latest
        steps:
            - name: Download dist artifact
              uses: actions/download-artifact@v4
              with:
                  name: dist-files
                  path: dist
            - name: Deploy dist
              run: echo "Deployment completed"
            