name: Deploy dist
on: push
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Get Code
              uses: actions/checkout@v4
              # run: |
              #   echo "Cloning repo"
              #   echo "${{toJson(github)}}"
              #   git clone https://github.com/${{github.repository}}.git myfiles
              #   cd myfiles && ls
            - name: Install nodejs
              uses: actions/setup-node@v3
              with:
                  node-version: 22
            - name: Print nodejs version
              run: node -v
            - name: Install dependencies
              run: npm install
            - name: Run Tests
              run: npm run test
            - name: Completed Job
              run: echo "Completed Job"
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Clone repo
              uses: actions/checkout@v4
            - name: Install nodejs
              uses: actions/setup-node@v3
              with:
                  node-version: 22
            - name: Print nodejs version
              run: node -v
            - name: Install dependencies
              run: npm install
            - name: Build dist
              run: npm run build